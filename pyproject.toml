[project]
name = "invest-system"
version = "0.0.1"
description = "López de Prado–style financial ML system — validation harness first"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "openpyxl>=3.1",  # JPX ToSTNeT 等の .xlsx 解析（pandas.read_excel）
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
live = ["ccxt>=4.0"]
ops = ["psycopg[binary]>=3.1", "yfinance>=0.2"]  # Phase 2 無人運用（Actions/同期）
dl = ["torch>=2.0"]  # 深層SDF（候補② Stage2・CPUで可）

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
